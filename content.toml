[[sections.items]]
name = "Orbit"
link = "https://www.orbit-fms.com"
link_text = "orbit-fms.com"
dates = "2026.08 ~ 현재"
description = """
GPS 단말로 기업 차량을 실시간 관제하는 멀티테넌트 SaaS입니다. 웹 서비스와 모바일 앱(App Store, Google Play)을 출시해 운영하고 있습니다. 단말 데이터는 CloudFront, Lambda, SNS를 거쳐 환경별 SQS로 팬아웃해 받습니다. 백엔드와 인프라를 맡고 있습니다.

**기술**: TypeScript, Next.js, PostgreSQL, Redis, AWS SQS

* 위치 수신 워커 락 경합을 프로파일링으로 찾아 처리량 약 3배 개선 (부하 테스트)
* SQS at-least-once 전달에 대비해 원문 해시 중복 제거로 멱등성 보장
* Lua 스크립트로 더 최신 위치만 Redis에 저장해 순서 비보장 대응
* 운영 측위 데이터로 정지 차량 좌표 튐 보정, p95 170m&nbsp;→&nbsp;26m
* PostgreSQL RLS로 테넌트별 데이터 격리
* Redis Pub/Sub과 SSE로 차량 위치 실시간 스트리밍
"""

[[sections.items]]
name = "이음"
dates = "2025.06 ~ 2025.12\n고도화 2026.08 ~ 2026.10"
description = """
관리자 웹의 예약과 실시간 배차를 운전자 앱의 수락과 운행으로 잇는 관제 플랫폼입니다. 6명 팀에서 백엔드를 맡았습니다. 1차 개발에서는 배차와 예약의 동시성 제어를, 고도화에서는 쿼리와 화면 성능 개선을 맡았습니다(차량 20대 기준).

**기술**: Java, Spring Boot, PostgreSQL, PostGIS, Redis

* advisory lock과 조건부 UPDATE로 배차 동시성 제어, 초과 예약 방지
* 새벽 배치에서 그리디 알고리즘으로 예약 배차 자동 배정
* 외부 API 호출을 트랜잭션 커밋 이후로 분리해 알림 누락 해소
* 콜 신청 지연 원인인 풀 스캔을 LATERAL 조인으로 해결, 2.1초&nbsp;→&nbsp;1ms 미만 (dev)
* REQUIRES_NEW로 생긴 커넥션 풀 고갈을 MANDATORY 전파로 수정
* ECU 이력 조회에 복합 인덱스 적용, 응답 3초&nbsp;→&nbsp;0.1초 (dev)
"""

